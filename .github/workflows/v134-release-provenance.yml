name: v1.3.4-release-provenance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit/tag to build"
        required: false
  push:
    tags:
      - "v1.3.4"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Contract and regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "runtime"
          python -m pytest tests -q
      - name: Negative-attack suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = "runtime"
          python scripts/run_attack_suite.py
      - name: Build release package
        shell: pwsh
        run: |
          $env:PYTHONPATH = "runtime"
          python scripts/build_release.py
      - name: Record build provenance
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          @{
            repository = "${{ github.repository }}"
            workflow_run_id = "${{ github.run_id }}"
            commit = "${{ github.sha }}"
            package = $zip.Name
            package_sha256 = $sha
            generated_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content dist/build-provenance.json
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: uiux-suite-1.3.4
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/build-provenance.json
