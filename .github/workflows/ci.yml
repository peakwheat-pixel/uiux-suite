name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run test suite
        env:
          PYTHONPATH: runtime
        run: python -m pytest tests -q

  windows-smoke:
    name: Python 3.12 / Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run contract and CLI tests
        env:
          PYTHONPATH: runtime
        run: python -m pytest tests/integration/test_cli.py tests/unit/test_schemas.py tests/unit/test_semantics.py -q
